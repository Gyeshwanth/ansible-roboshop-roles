- name: "copying  service"
  ansible.builtin.template:
    src: "{{ server }}.service.j2"
    dest: "/etc/systemd/system/{{ server }}.service"

- name: "daemon_reload {{ server }}/systemctl daemon reload"
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: "started and enabled {{ server }}"
  ansible.builtin.service:
    name: "{{ server }}"
    state: restarted
    enabled: true
