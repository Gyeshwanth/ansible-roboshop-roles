- name: copying mongodb
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo


- name: installing mongodb
  ansible.builtin.dnf:
    name: mongodb-org
    state: present

- name: staring and enabled mongodb
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: true

- name: updated address
  ansible.builtin.replace:
    path: /etc/mongod.conf
    regexp: 127.0.0.1
    replace: 0.0.0.0
  notify: restarted mongodb

